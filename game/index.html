<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🧋 水豚奶茶接接乐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== START SCREEN ===== -->
    <div id="start-screen" class="screen active">
        <div class="title-container">
            <div class="title-deco">🥤✨🔮</div>
            <h1 class="game-title">水豚<br>奶茶接接乐</h1>
            <div class="title-deco">🔮✨🥤</div>
        </div>
        <div class="capybara-preview">
            <div class="capybara-art">
                <div class="capy-body-preview"></div>
                <div class="capy-head-preview">
                    <div class="capy-ear left"></div>
                    <div class="capy-ear right"></div>
                    <div class="capy-face-preview">
                        <div class="capy-eye left"></div>
                        <div class="capy-eye right"></div>
                        <div class="capy-nose-preview"></div>
                        <div class="capy-mouth-preview"></div>
                        <div class="capy-blush left"></div>
                        <div class="capy-blush right"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="instructions">
            <p>🎮 帮助水豚接住美味的奶茶点心！</p>
            <p>⬅️➡️ 使用<strong>方向键</strong>或<strong>A/D</strong>移动</p>
            <p>📱 手机上：使用底部控制台移动和召唤</p>
            <p>🥤 接住好东西可以得分！</p>
            <p>🌶️ 躲开坏东西，否则会失去爱心！</p>
            <p>✨ 积攒 200 分可以召唤一位帮手！</p>
        </div>
        <div id="login-panel" class="login-panel">
            <h2>👋 先选择你的昵称</h2>
            <div id="account-options" class="account-options" role="group" aria-label="选择昵称">
                <button class="account-option selected" data-account-id="child-1">小月</button>
                <button class="account-option" data-account-id="child-2">小溪</button>
                <button class="account-option" data-account-id="child-3">小曦</button>
                <button class="account-option" data-account-id="child-4">小伊</button>
            </div>
            <p id="selected-password-hint" class="password-hint" aria-live="polite">小月的密码：1010</p>
            <label class="login-label" for="password-input">输入密码</label>
            <input id="password-input" class="password-input" type="password" inputmode="numeric" maxlength="64" autocomplete="off" placeholder="请输入简单密码">
            <button id="login-btn" class="login-btn" type="button">🔐 登录</button>
            <p id="login-message" class="login-message" role="status"></p>
        </div>
        <button id="start-btn" class="cute-btn" disabled>🔐 登录后开始</button>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div id="game-screen" class="screen">
        <!-- HUD -->
        <div id="hud">
            <div id="score-display">🥤 分数：<span id="score">0</span></div>
            <div id="lives-display">
                <span id="hearts">❤️❤️❤️❤️❤️</span>
            </div>
            <div id="level-display">⭐ 关卡：<span id="level">1</span></div>
        </div>

        <!-- Helper summon preparation UI -->
        <div id="summon-bar">
            <div id="summon-status"><span id="summon-status-label">✨ 召唤能量</span>：<span id="summon-energy">0</span>/200</div>
            <div id="summon-progress-track" aria-label="召唤能量进度">
                <span id="summon-progress"></span>
            </div>
            <div id="next-helper">下一位：<span id="next-helper-name">帮手一</span></div>
        </div>

        <!-- Game Area -->
        <div id="game-area">
            <!-- 水豚角色（由 JavaScript 创建） -->
            <div id="capybara">
                <div class="capy-body">
                    <div class="capy-head">
                        <div class="capy-ear-game left"></div>
                        <div class="capy-ear-game right"></div>
                        <div class="capy-face">
                            <div class="capy-eye-game left"></div>
                            <div class="capy-eye-game right"></div>
                            <div class="capy-nose-game"></div>
                            <div class="capy-mouth-game"></div>
                            <div class="capy-blush-game left"></div>
                            <div class="capy-blush-game right"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Items will be spawned here -->
        </div>

        <!-- Unified game controls -->
        <div id="mobile-controls" aria-label="游戏控制台">
            <button id="btn-left" class="control-btn move-btn" type="button" aria-label="向左移动">
                <span class="control-icon">⬅️</span><span class="control-label">向左</span>
            </button>
            <button id="summon-btn" class="summon-btn control-btn" type="button" disabled>
                <span class="control-icon">✨</span><span class="control-label">召唤</span>
            </button>
            <button id="btn-right" class="control-btn move-btn" type="button" aria-label="向右移动">
                <span class="control-label">向右</span><span class="control-icon">➡️</span>
            </button>
        </div>
    </div>

    <!-- ===== GAME OVER SCREEN ===== -->
    <div id="gameover-screen" class="screen">
        <div class="gameover-container">
            <h2 class="gameover-title">哎呀！</h2>
            <div class="gameover-capy">😿🥤💔</div>
            <p class="gameover-text">水豚把奶茶打翻了！</p>
            <div class="final-score">
                <p>你的分数</p>
                <span id="final-score-value">0</span>
            </div>
            <p id="final-level" class="final-level-text">你到达了第1关！</p>
            <p id="gameover-message" class="gameover-msg"></p>
            <div id="leaderboard-panel" class="leaderboard-panel">
                <h3>🏆 最高分榜</h3>
                <ol id="leaderboard-list" class="leaderboard-list"></ol>
                <p id="leaderboard-message" class="leaderboard-message"></p>
            </div>
            <button id="restart-btn" class="cute-btn">🔄 再玩一次！</button>
        </div>
    </div>

    <!-- Floating effect container -->
    <div id="effects-container"></div>

    <script src="script.js"></script>
</body>
</html>
